# Workflow de auditoría de gobernanza.
# Propósito: ejecutar regresiones GOV.1.6 y verificación de whitespace en push/PR.
# Alcance: conserva triggers, permisos, jobs, actions y comandos del workflow.

name: Repository Governance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gobernanza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gobernanza:
    name: Auditoría de gobernanza
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Ejecutar regresiones GOV.1.6
        run: python -m unittest tests.test_gov16_controles_github -v
      - name: Verificar whitespace Git
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
