# Seguridad de dependencias y referencias de GitHub Actions.
#
# Complementa Dependabot y CodeQL. No modifica dependencias ni crea PR.
# Dependency Review se ejecuta únicamente en Pull Requests.

name: Dependency Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/audit_action_references.py"
      - "scripts/package*.json"

  push:
    branches:
      - main
    paths:
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/audit_action_references.py"
      - "scripts/package*.json"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar auditor de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1

      - name: Auditar referencias de GitHub Actions
        run: python scripts/audit_action_references.py

      - name: Auditar vulnerabilidades Python
        run: python -m pip_audit -r requirements.txt --strict

      - name: Auditar dependencias Node de automatización
        run: npm audit --prefix scripts --audit-level=high

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
