# Auditoría periódica integral del repositorio.
#
# Ejecuta controles que no deben penalizar cada Pull Request:
# vulnerabilidades, enlaces externos, tags y coherencia post-merge.
# No crea commits, tags, Releases ni modificaciones del repositorio.

name: Scheduled Repository Health

on:
  schedule:
    - cron: "0 14 * * 0"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-repository-health
  cancel-in-progress: false

jobs:
  scheduled-health:
    name: Scheduled Repository Health
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar main e historial completo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit==2.10.1

      - name: Actualizar tags
        run: git fetch --tags --force origin

      - name: Ejecutar gate integral
        env:
          HEALTH_JSON: ${{ runner.temp }}/repository-health.json
          HEALTH_MD: ${{ runner.temp }}/repository-health.md
        run: |
          python scripts/quality_gate.py \
            --full \
            --report-json "$HEALTH_JSON" \
            --summary-md "$HEALTH_MD"

      - name: Auditar supply chain
        run: |
          python scripts/audit_action_references.py
          python -m pip_audit -r requirements.txt --strict

      - name: Auditar enlaces externos
        env:
          LINKS_JSON: ${{ runner.temp }}/external-links.json
          LINKS_MD: ${{ runner.temp }}/external-links.md
        run: |
          python scripts/audit_external_links.py \
            --strict \
            --timeout 12 \
            --retries 2 \
            --json-out "$LINKS_JSON" \
            --markdown-out "$LINKS_MD"

      - name: Auditar todos los tags firmados
        run: python scripts/audit_signed_tags.py

      - name: Evaluar readiness de publicación
        env:
          READINESS_JSON: ${{ runner.temp }}/release-readiness.json
          READINESS_MD: ${{ runner.temp }}/release-readiness.md
        run: |
          python scripts/release_readiness.py \
            --json-out "$READINESS_JSON" \
            --markdown-out "$READINESS_MD"

      - name: Publicar resumen
        if: always()
        shell: bash
        run: |
          for report in \
            "${{ runner.temp }}/repository-health.md" \
            "${{ runner.temp }}/external-links.md" \
            "${{ runner.temp }}/release-readiness.md"
          do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Guardar evidencia semanal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-repository-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-health.json
            ${{ runner.temp }}/repository-health.md
            ${{ runner.temp }}/external-links.json
            ${{ runner.temp }}/external-links.md
            ${{ runner.temp }}/release-readiness.json
            ${{ runner.temp }}/release-readiness.md
          if-no-files-found: warn
          retention-days: 30
