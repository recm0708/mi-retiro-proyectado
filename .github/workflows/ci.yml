# Workflow de validación continua.
# Propósito: validar dependencias, compilación, JavaScript y pruebas en Python 3.13/3.14.
# Alcance: conserva matriz, triggers, permisos, actions y comandos del workflow.

name: Validación continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compilar Python
        run: python -m compileall app

      - name: Validar sintaxis JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' archivo; do
            node --check "$archivo"
          done < <(find app/static/js -type f -name '*.js' -print0)

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
