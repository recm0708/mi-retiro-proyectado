# Plantilla de solicitud de mejora.
# Propósito: separar necesidades funcionales, técnicas, documentales o de UX.
# Alcance: conserva labels, campos obligatorios y advertencias de privacidad/normativa.

name: Solicitud de mejora
description: Propón una mejora funcional, técnica, documental o de UX.
labels: ["enhancement", "needs-triage"]
title: "[MEJORA] "
body:
  - type: markdown
    attributes:
      value: |
        Describe la necesidad y el resultado deseado. No adjuntes información personal real.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - UX / accesibilidad
        - Cálculo previsional
        - Importación / datos
        - Seguridad / privacidad
        - Documentación / gobierno
        - Desarrollo / mantenimiento
        - Otro
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema o necesidad
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: No conviertas supuestos en requisitos normativos.
    validations:
      required: true
  - type: textarea
    id: impacto
    attributes:
      label: Impacto y riesgos
      description: Señala normativa, privacidad, seguridad, accesibilidad, datos o compatibilidad.
  - type: textarea
    id: checklist_trabajo
    attributes:
      label: Checklist de trabajo y cierre
      description: Mantén este checklist actualizado durante la vida de la Issue. Marca cada punto solo cuando exista evidencia suficiente.
      value: |
        - [ ] Confirmar alcance, dependencias y decisión de entrada.
        - [ ] Implementar la mejora aprobada sin ampliar alcance implícitamente.
        - [ ] Ejecutar pruebas, gates y evidencia aplicables.
        - [ ] Sincronizar documentación, trazabilidad e Issues derivadas.
        - [ ] Verificar el criterio de cierre y cerrar esta Issue.
    validations:
      required: true

  - type: checkboxes
    id: control
    attributes:
      label: Confirmaciones
      options:
        - label: He evitado incluir datos personales reales o secretos.
          required: true
        - label: Entiendo que una propuesta normativa necesita una fuente oficial verificable.
          required: true
