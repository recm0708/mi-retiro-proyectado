# Plantilla de consulta y soporte.
# Propósito: recibir preguntas de uso, instalación, documentación o desarrollo sin datos sensibles.
# Alcance: conserva labels, campos obligatorios y controles de privacidad.

name: Consulta / soporte
description: Solicita ayuda de uso, instalación, documentación o desarrollo sin exponer datos sensibles.
labels: ["question", "needs-triage"]
title: "[CONSULTA] "
body:
  - type: markdown
    attributes:
      value: |
        No incluyas cédulas, NSS, PDFs personales, historiales salariales reales,
        credenciales ni otros datos sensibles. Para vulnerabilidades utiliza SECURITY.md.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de consulta
      options:
        - Uso de la aplicación
        - Instalación / entorno de desarrollo
        - Documentación
        - Contribución / GitHub
        - Otro
    validations:
      required: true
  - type: textarea
    id: consulta
    attributes:
      label: Consulta
      description: Describe el contexto necesario usando datos sintéticos o anonimizados.
    validations:
      required: true
  - type: textarea
    id: intentos
    attributes:
      label: Qué has intentado
      description: Incluye comandos o mensajes de error sanitizados cuando ayuden.
  - type: textarea
    id: checklist_trabajo
    attributes:
      label: Checklist de trabajo y cierre
      description: Mantén este checklist actualizado durante la vida de la Issue. Marca cada punto solo cuando exista evidencia suficiente.
      value: |
        - [ ] Confirmar el alcance real de la consulta.
        - [ ] Investigar o reproducir lo necesario con información sanitizada.
        - [ ] Responder y validar que la consulta quedó resuelta.
        - [ ] Actualizar documentación o abrir Issue derivada si se detecta trabajo material.
        - [ ] Verificar el criterio de cierre y cerrar esta Issue.
    validations:
      required: true

  - type: checkboxes
    id: privacidad
    attributes:
      label: Confirmaciones
      options:
        - label: Confirmo que no he incluido datos personales reales, documentos personales ni secretos.
          required: true
        - label: Confirmo que esta consulta no contiene una vulnerabilidad que deba tratarse en privado.
          required: true
