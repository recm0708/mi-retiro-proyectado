# Etiquetado automático de Pull Requests por superficie modificada.
#
# Reutiliza exclusivamente la taxonomía de labels existente del repositorio.
# Una PR puede recibir varias etiquetas simultáneamente.

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"ui":
  - changed-files:
      - any-glob-to-any-file:
          - "app/templates/**"
          - "app/static/css/**"
          - "app/static/js/**"
          - "app/static/img/**"

"accessibility":
  - changed-files:
      - any-glob-to-any-file:
          - "app/static/css/accessibility.css"
          - "app/static/js/accessibility.js"
          - "scripts/visual_a11y_audit.mjs"
          - ".github/workflows/visual-a11y.yml"

"security":
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "docs/security/**"
          - "app/**/*security*.py"

"regulations":
  - changed-files:
      - any-glob-to-any-file:
          - "regulations/**"
          - "docs/regulatory/**"
          - "data/regulatory/**"

"backend":
  - changed-files:
      - any-glob-to-any-file:
          - "app/**/*.py"

"tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

"github-actions":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".githooks/**"
          - "scripts/**"
          - "requirements-dev.txt"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "requirements*.txt"
          - "scripts/package.json"
          - "scripts/package-lock.json"
          - ".github/dependabot.yml"

"maintenance":
  - changed-files:
      - any-glob-to-any-file:
          - "VERSION"
          - "data/pre-1-0-revision-ledger.json"
          - "data/release-publication-manifest.json"
          - "data/work-block-registry.json"
          - "docs/governance/**"
