# Configuración para "Generate release notes" de GitHub.
# La estructura final y los campos obligatorios se rigen por
# docs/operations/release-process.md.
changelog:
  exclude:
    authors:
      - dependabot
  categories:
    - title: Funcionalidad y UX
      labels:
        - enhancement
        - ui
    - title: Seguridad y privacidad
      labels:
        - security
        - privacy
    - title: Correcciones
      labels:
        - bug
    - title: Documentación y gobierno
      labels:
        - documentation
        - governance
    - title: Dependencias y mantenimiento
      labels:
        - dependencies
        - maintenance
    - title: Otros cambios
      labels:
        - "*"
