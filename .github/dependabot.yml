# MANT.1 R3 — configuración de mantenimiento automatizado de dependencias.
# Propósito: agrupar y limitar actualizaciones de runtime Python y GitHub Actions.
# No modifica dependencias fijadas, cadencia semanal ni límites de Pull Requests.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: fastapi
      - dependency-name: Jinja2
      - dependency-name: pydantic
      - dependency-name: python-multipart
      - dependency-name: pypdf
      - dependency-name: uvicorn
    groups:
      python-runtime-minor-patch:
        applies-to: version-updates
        patterns:
          - fastapi
          - Jinja2
          - pydantic
          - python-multipart
          - uvicorn
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
