# Configuración de mantenimiento automatizado de dependencias.
# Propósito: agrupar y limitar actualizaciones de runtime Python y GitHub Actions.
# Alcance: conserva cadencia semanal, límites de Pull Requests y ecosistemas configurados.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: fastapi
      - dependency-name: Jinja2
      - dependency-name: pydantic
      - dependency-name: python-multipart
      - dependency-name: pypdf
      - dependency-name: uvicorn
    groups:
      python-runtime-minor-patch:
        applies-to: version-updates
        patterns:
          - fastapi
          - Jinja2
          - pydantic
          - python-multipart
          - uvicorn
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/scripts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: playwright
      - dependency-name: "@axe-core/playwright"
    groups:
      automation-node-minor-patch:
        applies-to: version-updates
        patterns:
          - playwright
          - "@axe-core/playwright"
        update-types:
          - minor
          - patch
